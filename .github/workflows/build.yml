name: Build

# Manual only for now, until the pipeline has been run by hand a few times. Add back
#   push:
#     branches: [ 26.2 ]
#   pull_request:
#     branches: [ 26.2 ]
# above workflow_dispatch to have it run on its own.
on:
  workflow_dispatch:

# Every job sets Minecraft up from scratch, so a newer run on the same ref makes the running one a
# waste of a runner. Keyed on the event too, so a push never cancels a manual run once triggers
# are back on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      - name: Build
        run: ./gradlew build --stacktrace

      # Tests live in their own source set and are never an input to `jar`. A jar that ships them
      # still works, which is why this is checked rather than trusted.
      - name: No test classes ship in the jars
        run: |
          status=0
          for jar in */build/libs/*.jar; do
            hits=$(unzip -l "$jar" | grep -icE 'gametest|test_instance|test_box' || true)
            if [ "$hits" != "0" ]; then
              echo "::error::$jar ships $hits gametest entries"
              status=1
            fi
          done
          exit $status

      - name: Upload the jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !**/*-sources.jar

  gametest:
    name: Gametests (${{ matrix.loader }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Both loaders always run: which one fails is the useful half of the answer.
      fail-fast: false
      matrix:
        include:
          - loader: neoforge
            task: ':neoforge:runGameTestServer'
            run_dir: neoforge/run
          - loader: fabric
            task: ':fabric:runGameTest'
            run_dir: fabric/build/gametest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      # Boots a dedicated server, runs every test_instance, exits non-zero on a failed required
      # test.
      - name: Run the gametests
        run: ./gradlew ${{ matrix.task }} --stacktrace

      - name: Upload the run directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-${{ matrix.loader }}
          if-no-files-found: ignore
          path: |
            ${{ matrix.run_dir }}/logs/
            ${{ matrix.run_dir }}/crash-reports/
            ${{ matrix.run_dir }}/report.xml

  datagen:
    name: Datagen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build

      # Catches generated output that was never regenerated and committed.
      - name: Datagen is committed
        run: |
          ./gradlew :neoforge:runClientData :neoforge:runServerData :fabric:runDatagenClient --stacktrace
          changed="$(git status --porcelain -- common/src/generated fabric/src/generated)"
          if [ -n "$changed" ]; then
            echo "::error::Datagen does not match what is committed"
            echo "$changed"
            git diff --stat -- common/src/generated fabric/src/generated
            exit 1
          fi
